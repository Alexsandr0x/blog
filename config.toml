      url = "/posts/"
      weight = 3

    [[languages.pt-br.menu.main]]
      identifier = "lessons"
      name = "Palestras"
      url = "/lessons/"
      weight = 4

    [[languages.pt-br.menu.main]]
      identifier = "projects"
      name = "Projetos"
      url = "/projects/"
      weight = 5

    [[languages.pt-br.menu.main]]
      identifier = "hea"
      name = "HEA"
      url = "/hea/"
      weight = 6

  [languages.en]
    label = 'English'
    locale = 'en-US'
    weight = 2

    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
