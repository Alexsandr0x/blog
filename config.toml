baseURL = 'https://alexsandro.dev/'
defaultContentLanguage = 'pt-br'
title = 'Alexsandro'
ignoreFiles = ['.*README\.md$', '.*\.gitkeep$']

[params]
noindex = false
# GoatCounter: nome da conta (ex.: "alexsandro" para alexsandro.goatcounter.com). Vazio = desligado.
goatcounter = "alexsandr0x"
# Contato: página em rascunho (content/contact, draft: true) e fora do menu até o email receber de verdade. Para reativar: preencher contactEmail, tirar o draft e recolocar o item "contact" no menu.
# Email público da página de contato. Só preencha depois que o endereço existir e estiver recebendo.
contactEmail = ""
# Google Search Console: conteúdo da meta de verificação (só se verificar por tag HTML). Vazio = sem a tag.
googleSiteVerification = ""

[params.about]
title = "Alex"
description = "Tech Lead de Dados, professor por vocação e eterno aprendiz."

[[params.socialLinks]]
url = "https://linkedin.com/in/Alexsandr0x"
title = "LinkedIn"
icon = "fa-brands fa-linkedin"

[[params.socialLinks]]
url = "https://github.com/Alexsandr0x"
title = "GitHub"
icon = "fa-brands fa-github"

[languages]
  [languages.pt-br]
    label = 'Português'
    locale = 'pt-BR'
    weight = 1

    [[languages.pt-br.menu.main]]
      identifier = "about"
      name = "Sobre"
      url = "/about/"
      weight = 1

    [[languages.pt-br.menu.main]]
      identifier = "portfolio"
