<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-inner{{ end }}">
  <a class="skip" href="#conteudo">{{ i18n "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="conteudo" class="site-main">
    <div class="wrap">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
