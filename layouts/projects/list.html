{{ define "main" }}
<header class="content__header">
    <h1>{{ .Title | markdownify }}</h1>
    {{ .Content }}
</header>

{{ range .Pages.ByDate.Reverse }}
<article class="post">
    <header class="post__header">
        <h1><a href="{{ .Permalink }}">{{ .Title | markdownify }}</a></h1>
    </header>
    <section class="post__summary">
        {{ .Description }}
    </section>
    </br>
</article>
{{ end }}
{{ end }}
